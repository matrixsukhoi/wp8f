[package]
name = "wp8f-disp"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[features]
default = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
winit = "0.31.0-beta.2"
softbuffer = "0.4"
ab_glyph = "0.2"
memmap2 = "0.9"
datalink = { path = "../datalink" }
wp8f-ring = { path = "../ring" }

[lib]
name = "wp8f_disp"
path = "src/lib.rs"
