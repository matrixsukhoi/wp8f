[package]
name = "wp8f-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[features]
default = []

[dependencies]
wp8f-logger = { path = "../logger" }
wp8f-disp = { path = "../disp" }
wp8f-flightmodel = { path = "../flightmodel" }
datalink = { path = "../datalink" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "io-util", "net"] }
clap = { version = "4.5", features = ["derive"] }
rodio = "0.19"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[lib]
name = "wp8f_core"
path = "src/lib.rs"

[[bin]]
name = "wp8f-core"
path = "src/main.rs"
