[package]
name = "test-server"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Test server for wp8f - simulates War Thunder game server on port 8111"

[dependencies]
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[[bin]]
name = "test-server"
path = "src/main.rs"
